[project]
name = "hotline-listing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "redis==8.1.0",
    "pyyaml==6.0.3",
    "pydantic==2.14.3",
    "jinja2==3.1.6",
    "sqlalchemy[asyncio]==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    "apscheduler==3.11.3",
    "python-multipart==0.0.33",
]

[tool.setuptools.packages.find]
where = ["sources/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["sources/src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "testcontainers[postgres]>=4.15.0",
]

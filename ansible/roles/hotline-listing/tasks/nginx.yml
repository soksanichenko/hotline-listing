---
- name: Deploy hotline-listing nginx location config
  ansible.builtin.template:
    src: nginx-location.conf.j2
    dest: "{{ hotline_listing_nginx_custom_locations_path }}/hotline-listing.conf"
    mode: '0644'
  become: yes
  when: hotline_listing_nginx_proxy
  notify: Reload nginx

- name: Deploy hotline-listing legacy subpath redirect
  ansible.builtin.template:
    src: nginx-legacy-redirect.conf.j2
    dest: "{{ nginx_domain_custom_locations_path }}/hotline-listing.conf"
    mode: '0644'
  become: yes
  when: hotline_listing_nginx_proxy
  notify: Reload nginx

- name: Register hotline-listing with the Discord SSO portal
  ansible.builtin.uri:
    url: https://meow-elite.club/api/services/register
    method: POST
    headers:
      Authorization: "Bearer {{ meow_elite_club_portal_service_registration_token }}"
    body_format: json
    body:
      slug: "{{ hotline_listing_service_slug }}"
      name: "Hotline.ua price listing"
      url: "https://{{ hotline_listing_domain }}/"
    status_code: [200]
  when: hotline_listing_nginx_proxy
  no_log: true
...

---
hotline_listing_container_name: 'hotline-listing'
hotline_listing_image: 'hotline-listing:local'
hotline_listing_http_port: 8999
hotline_listing_data_dir: "{{ docker_volumes_directory }}/hotline-listing"
hotline_listing_nginx_proxy: false
hotline_listing_root_path: '/hotline-listing'

# Discord SSO gate (meow-elite-club-portal): the portal's own container name
# and port on the shared Docker network, and the X-Service-Slug this service
# is registered under via /admin/services (see nginx-location.conf.j2). Must
# match the `slug` of the GatedService row an admin creates for this service
# — a mismatch fails every request closed.
#
# Referenced via nginx `resolver` + `set` (not a static nginx `upstream {}`
# block) — a static block resolves this hostname's IP once, at nginx
# startup/reload, and keeps using it even after the portal container is
# recreated with a new IP by its own independent deploy. That staleness
# broke auth here (and on every other gated service) until the next nginx
# reload — see the 2026-09-13 incident. `resolver`+`set` re-resolves on its
# own every 10s, so a portal redeploy alone can never break this again.
meow_elite_club_portal_container_name: 'meow-elite-club-portal'
meow_elite_club_portal_http_port: 8867
hotline_listing_service_slug: 'hotline-listing'

# Path to the project on the Ansible controller — used to sync source before build.
hotline_listing_local_source_dir: "{{ playbook_dir }}/../.."

# Connection strings used in the templated config.yaml mounted into the container.
hotline_listing_database_url: "postgresql://postgres:{{ postgres_password }}@{{ postgresql_container_name }}:5432/hotline_prices"
hotline_listing_redis_url: "redis://{{ redis_container_name }}:6379"
hotline_listing_cache_ttl: 3600
hotline_listing_city_id: 154
...
